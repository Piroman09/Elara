// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.20'
        // From Kotlin 2.0 the Compose compiler ships as this plugin instead of
        // a versioned compiler artifact — it moves in lockstep with Kotlin.
        classpath 'org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.20'
    }
}

tasks.register("clean", Delete) {
    delete layout.buildDirectory
}
