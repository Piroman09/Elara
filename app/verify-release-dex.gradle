// ---------------------------------------------------------------------------
// verifyReleaseDex — the release-build gate.
//
// WHY THIS EXISTS
// R8 maps JSON keys onto *field names*. If it strips or renames a field, Gson
// does not throw — it silently deserialises to null and the app quietly loses
// the user's data. There is no emulator on this machine, so that failure cannot
// be caught at runtime before shipping. This task is the substitute: it reads
// the built release APK and asserts, byte for byte, that the reflection-critical
// classes, fields and enum constants actually survived into classes.dex.
//
// It is a heuristic (substring search over the dex), not a dex parser. That is
// deliberate: it has no dependencies, runs in about a second, and every check
// in it is a check that has a real failure mode behind it.
//
// It also audits proguard-rules.pro itself, because the rules are load-bearing
// and deleting one is silent — `-dontobfuscate` in particular looks like a
// needless cost to anyone who has not read the note at the top of that file.
//
// Wired via `assembleRelease.finalizedBy`, so a normal release build runs it.
// Escape hatch: `./gradlew assembleRelease -PskipDexVerify`
//
// HOW TO EXTEND
// Adding a new Gson-persisted type? Add its fully-qualified name to
// `requiredTypes` (nested classes use `$`) and its field names to
// `requiredFields`, then run `./gradlew verifyReleaseDex` to confirm.
// ---------------------------------------------------------------------------

def proguardFile = file('proguard-rules.pro')

// Directives that must still be present in proguard-rules.pro. Whitespace is
// normalised and comments are stripped before matching, so reformatting is fine
// but deleting a rule is not.
def requiredProguardDirectives = [
        '-dontobfuscate',
        '-keepattributes Signature',
        '-keep class com.piroman.elara.data.network.** { *; }',
        '-keep class com.piroman.elara.data.model.** { *; }',
        '-keep class com.piroman.elara.data.playlist.Playlist { *; }',
        '-keep class com.piroman.elara.data.download.DownloadManager$Entry { *; }',
        '-keep class com.piroman.elara.data.download.DownloadManager$Pending { *; }',
        '-keep class com.piroman.elara.data.history.PlayStat { *; }',
        '-keep class com.piroman.elara.data.history.MonthAggregate { *; }',
        '-keep class com.piroman.elara.data.backup.ElaraBackup { *; }',
]

// Every type Gson reads or writes, plus the entry points the manifest names.
// Derived from auditing each `fromJson` call site and each Retrofit endpoint.
def requiredTypes = [
        // Persisted to disk and read back — losing one loses user data.
        'com.piroman.elara.data.model.Track',
        'com.piroman.elara.data.model.Playlist',
        'com.piroman.elara.data.model.LyricLine',
        'com.piroman.elara.data.model.VibeCoords',
        'com.piroman.elara.data.model.MusicSource',
        'com.piroman.elara.data.model.SafeGson',
        'com.piroman.elara.data.playlist.Playlist',
        'com.piroman.elara.data.download.DownloadManager$Entry',
        'com.piroman.elara.data.download.DownloadManager$Pending',
        'com.piroman.elara.data.history.PlayStat',
        'com.piroman.elara.data.history.MonthAggregate',
        'com.piroman.elara.data.backup.ElaraBackup',
        // Deserialised by Retrofit's Gson converter. One representative per API.
        'com.piroman.elara.data.network.JioSong',
        'com.piroman.elara.data.network.SCTrack',
        'com.piroman.elara.data.network.LrcLibResult',
        'com.piroman.elara.data.network.ITunesResult',
        // Referenced from AndroidManifest.xml, where a keep-rule mistake is fatal.
        'com.piroman.elara.AuraSonicApp',
        'com.piroman.elara.MainActivity',
        'com.piroman.elara.playback.PlaybackService',
]

// Field names Gson needs to find by reflection. A miss here means silent data
// loss, so the distinctive names are the ones that carry real signal.
def requiredFields = [
        'data.model.Track'         : ['id', 'videoId', 'title', 'artist', 'artistId', 'album',
                                      'albumArt', 'audioUrl', 'duration', 'genre', 'energy',
                                      'accentColor', 'isLiked', 'source', 'tags'],
        'data.model.Playlist'      : ['id', 'name', 'description', 'coverArt', 'tracks'],
        'data.playlist.Playlist'   : ['id', 'name', 'createdAt', 'tracks'],
        'DownloadManager$Entry'    : ['track', 'path'],
        'DownloadManager$Pending'  : ['downloadId', 'track', 'finalPath'],
        // Play counts. `count` is the one that matters: lose it and every track
        // silently reads back as zero plays, so "Most played" empties itself.
        'data.history.PlayStat'    : ['track', 'count'],
        // Wrapped's monthly aggregate. Losing `trackCounts` resets the month's
        // top-songs ranking; losing `month` makes every rollover think the
        // month just turned and wipes the aggregate.
        'data.history.MonthAggregate': ['month', 'ms', 'plays', 'trackCounts'],
        // The exported library document. Losing `playStats` or `recentTracks`
        // here means a restore silently drops them instead of failing.
        'data.backup.ElaraBackup'  : ['version', 'exportedAt', 'playlists', 'likedTracks',
                                      'recentTracks', 'playStats', 'musicSource'],
]

def requiredEnumConstants = [
        'JIOSAAVN',
        'YOUTUBE_MUSIC',
]

// Descriptors proving the Retrofit/Gson runtime machinery and its annotations
// survived. `Lretrofit2/http/GET;` is an annotation descriptor — note that
// `RuntimeVisibleAnnotations` is a class-file attribute name and never appears
// as a string in a dex, so it is deliberately not checked here.
def requiredFrameworkDescriptors = [
        'Lretrofit2/Retrofit;',
        'Lretrofit2/http/GET;',
        'Lretrofit2/http/POST;',
        'Lcom/google/gson/Gson;',
        'Lcom/google/gson/annotations/SerializedName;',
        'Lcom/google/gson/reflect/TypeToken;',
]

tasks.register('verifyReleaseDex') {
    group = 'verification'
    description = 'Asserts the R8-processed release dex still contains every reflection-critical symbol.'

    // No dependsOn(assembleRelease): assembleRelease is finalisedBy this task,
    // and declaring both directions on one pair is a dependency cycle.
    doLast {
        def failures = []

        // --- 0. the anonymous-TypeToken source ban --------------------------
        // `object : TypeToken<List<T>>() {}.type` resolves T from the anonymous
        // subclass's generic superclass *signature*. R8 does not preserve those: the
        // 2026-09-21 release dex held eleven of these subclasses merged into a single
        // class carrying a single `Signature` attribute, so getGenericSuperclass()
        // returned the raw type and Gson threw "TypeToken must be created with a type
        // argument". Every store then read as EMPTY — with the real data still on disk,
        // 41 KB of playlists in the failing case — and the next save overwrote it.
        //
        // `-keepattributes Signature` was ALREADY in proguard-rules.pro and did not
        // prevent it, which is why this is a source check rather than a rule check.
        // `listTypeOf(...)` builds the type from Class literals instead, so there is no
        // signature for R8 to strip.
        //
        // This cannot be caught by a unit test: the failure only exists in the
        // R8-processed release build.
        def bannedPattern = 'object : TypeToken'
        def offenders = []
        def mainSources = file('src/main')
        if (mainSources.exists()) {
            mainSources.eachFileRecurse { f ->
                if (f.isFile() && (f.name.endsWith('.kt') || f.name.endsWith('.java'))) {
                    f.readLines().eachWithIndex { line, idx ->
                        def trimmed = line.trim()
                        // The pattern is named in the KDoc that explains the ban, so
                        // comment lines are not offenders.
                        def isComment = trimmed.startsWith('*') ||
                                trimmed.startsWith('//') ||
                                trimmed.startsWith('/*')
                        if (line.contains(bannedPattern) && !isComment) {
                            offenders << "${f.path}:${idx + 1}"
                        }
                    }
                }
            }
        }
        if (offenders) {
            failures << "anonymous TypeToken subclass in main sources — R8 merges these and " +
                    "the generic signature is lost at runtime, so the store reads as empty " +
                    "and the next save overwrites the user's data. Use listTypeOf(...) " +
                    "(data/model/SafeGson.kt) instead:\n        " +
                    offenders.join('\n        ')
        }

        // --- 1. proguard-rules.pro -----------------------------------------
        if (!proguardFile.exists()) {
            failures << "proguard-rules.pro is missing — the release build has no keep rules."
        } else {
            def rules = proguardFile.readLines()
                    .findAll { !it.trim().startsWith('#') }
                    .join(' ')
                    .replaceAll(/\s+/, ' ')
                    .trim()
            requiredProguardDirectives.each { directive ->
                def needle = directive.replaceAll(/\s+/, ' ').trim()
                if (!rules.contains(needle)) {
                    failures << "proguard-rules.pro no longer contains: ${directive}"
                }
            }
        }

        // --- 2. locate and read the release APK ----------------------------
        def apkDir = file('build/outputs/apk/release')
        def apks = apkDir.exists() ? (apkDir.listFiles()?.findAll { it.name.endsWith('.apk') } ?: []) : []
        def apk = apks.find { it.name == 'Elara.apk' } ?: apks.first()
        if (apk == null) {
            throw new GradleException(
                    "verifyReleaseDex: no release APK in ${apkDir}.\n" +
                            "Run `./gradlew assembleRelease` first (or drop -PskipDexVerify).")
        }

        def dexBlobs = []
        new java.util.zip.ZipFile(apk).withCloseable { zip ->
            def dexEntries = zip.entries().toList().findAll { it.name ==~ /classes\d*\.dex/ }
            if (dexEntries.isEmpty()) {
                throw new GradleException("verifyReleaseDex: ${apk.name} contains no classes*.dex.")
            }
            dexEntries.each { entry ->
                zip.getInputStream(entry).withCloseable { input ->
                    // ISO-8859-1 is a 1:1 byte->char mapping, so this is a safe
                    // way to substring-search binary without corrupting offsets.
                    dexBlobs << new String(input.bytes, 'ISO-8859-1')
                }
            }
        }
        def inDex = { String needle -> dexBlobs.any { it.contains(needle) } }

        // --- 3. the symbol checks -----------------------------------------
        requiredTypes.each { type ->
            def descriptor = 'L' + type.replace('.', '/') + ';'
            if (!inDex(descriptor)) {
                failures << "class stripped from the dex: ${type}  (expected ${descriptor})"
            }
        }

        requiredFields.each { owner, fields ->
            fields.each { field ->
                if (!inDex(field)) {
                    failures << "field missing: ${owner}.${field}"
                }
            }
        }

        requiredEnumConstants.each { constant ->
            if (!inDex(constant)) {
                failures << "enum constant missing: ${constant}"
            }
        }

        requiredFrameworkDescriptors.each { descriptor ->
            if (!inDex(descriptor)) {
                failures << "framework descriptor missing: ${descriptor}"
            }
        }

        // --- 4. report -----------------------------------------------------
        def fieldCount = requiredFields.values().sum { it.size() } ?: 0
        logger.lifecycle("verifyReleaseDex: ${apk.name} (${apk.length()} bytes, " +
                "${dexBlobs.size()} dex file(s))")
        logger.lifecycle("  proguard rules    : ${requiredProguardDirectives.size()}")
        logger.lifecycle("  source ban        : no anonymous TypeToken subclass in src/main")
        logger.lifecycle("  required classes  : ${requiredTypes.size()}")
        logger.lifecycle("  required fields   : ${fieldCount}")
        logger.lifecycle("  enum constants    : ${requiredEnumConstants.size()}")
        logger.lifecycle("  framework symbols : ${requiredFrameworkDescriptors.size()}")

        if (failures) {
            throw new GradleException(
                    "\nverifyReleaseDex FAILED — ${failures.size()} symbol(s) did not survive R8.\n" +
                            "This means Gson would silently lose data at runtime, and there is no\n" +
                            "emulator here to catch it. Check app/proguard-rules.pro first.\n\n" +
                            failures.collect { '  - ' + it }.join('\n'))
        }

        logger.lifecycle("  result            : OK — every reflection-critical symbol survived")
    }
}

// A normal release build is a verified release build.
tasks.matching { it.name == 'assembleRelease' }.configureEach {
    if (!project.hasProperty('skipDexVerify')) {
        finalizedBy 'verifyReleaseDex'
    }
}
