plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    // Replaces the pinned `kotlinCompilerExtensionVersion` — mandatory from
    // Kotlin 2.0, where the Compose compiler ships with the language.
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace = 'com.piroman.elara'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.piroman.elara"
        minSdk = 26
        targetSdk = 34
        // Bumped on every handover. This app is sideloaded from a file, not a
        // store, and both of these were static through several rounds of fixes —
        // so "the fix still isn't there" could not be told apart from "the old
        // APK is still installed". Player Settings now prints both values, and
        // the footer's *presence* is itself the signal: any build from before
        // 2026-09-18 has no version footer at all.
        //
        // 1.3 (build 4) — 2026-09-21. Persistence durability round. The source
        // changed after build 3 was produced (AtomicFileWrite gained a lock, and
        // DownloadManager's four index writes became atomic `update { }`), so
        // build 3's number would have pointed at two different APKs.
        //
        // 1.4 (build 5) — 2026-09-21. Download index repair: loadIndex() now drops
        // entries whose `track` came back null from Gson's `Unsafe` path, instead of
        // letting that null reach the ten `it.track.id` call sites.
        //
        // 1.5 (build 6) — 2026-09-21. THE ACTUAL DATA-LOSS FIX. Every persisted store
        // used `object : TypeToken<List<T>>() {}`, whose element type comes from an
        // anonymous subclass's generic superclass signature. R8 merged those subclasses
        // and the signature was lost, so all four stores threw "TypeToken must be created
        // with a type argument" on every launch, read as EMPTY, and the next save
        // overwrote the user's real data — release builds only. Now built from Class
        // literals via listTypeOf(), with a source ban in verifyReleaseDex.
        //
        // 1.6 (build 7) — 2026-09-21. Home redesign. Every shelf on Home is now
        // the same 136 dp tile with centred labels underneath (the featured
        // playlists stopped being a bordered 150×190 card with the text inside),
        // and section headings across Home and Library moved to one shared
        // component in the light-violet accent. No persistence, playback or
        // data-model code was touched, so nothing here can affect the data-loss
        // fix above — the number is bumped only so a report of "Home looks the
        // same" can be told apart from "the old APK is still installed".
        //
        // 1.7 (build 8) — 2026-09-21. Four new Home rows: Browse categories,
        // Top charts, New releases and Throwback. Charts and new releases come
        // from two JioSaavn endpoints that were not wired up before
        // (`content.getCharts`, `content.getAlbums`), and albums needed a
        // separate song mapper because `webapi.get?type=album` returns a flat
        // payload with no `more_info` — feeding it through the existing mapper
        // would have opened every album empty. Browse categories has no feed on
        // this host and is search-backed; see `HomeCategories`. The tile model
        // was renamed `FeaturedPlaylist` -> `BrowseTile` now that it also holds
        // albums, which are not playlists. No persistence, playback or data-model
        // code changed, so nothing here touches the 1.5 data-loss fix.
        //
        // 1.8 (build 9) — 2026-09-21. Fixes the full-screen player's like button,
        // which stored the like correctly but never repainted its icon: the heart
        // read `viewModel.isLiked(track)`, and that helper reads `_likedTracks.value`
        // once without subscribing the composable to the flow, so the icon kept
        // showing its first answer. The player now collects `likedTracks`, so the
        // icon follows the tap. One UI read replaced; no persistence, playback or
        // data-model change, so the 1.5 data-loss fix is untouched. Also renames a
        // shadowed `track` in the up-next row to `queueTrack` — it shadowed the
        // currently-playing `track`, so the same name meant two things a few lines
        // apart. That was the only Kotlin warning in the tree; incremental builds had
        // been hiding it, since unchanged files are not recompiled and so do not
        // re-emit their warnings.
        //
        // 1.9 (build 10) — 2026-09-21. Two more Home rows, both from real feeds.
        // "New songs" is the other half of the `content.getAlbums` response that
        // the album filter was discarding — 17 playable songs per call, already
        // paid for. That needed `more_info` to survive parsing on
        // `JioFeaturedPlaylist`, and the third `more_info`-shaped song mapper
        // triggered an extraction into `trackFromMoreInfo`, so the artist parsing
        // and artwork upgrade cannot drift between the three call sites.
        // "Trending searches" is `content.getTopSearches` — a fixed 10 titles —
        // rendered as chips that search, because the feed mixes albums, songs and
        // artists and has no single open action. `CategoryShelf` became `ChipShelf`
        // so both chip rows share one implementation. Re-probed 12 further
        // endpoints: all unsupported, and `page` is accepted but ignored on the
        // feeds that exist, so there is no more depth to mine here.
        //
        // 1.10 (build 11) — 2026-09-21. Two YouTube Music rows on Home, and the
        // Music Source setting now governs them: they appear under Auto and
        // YouTube Music, and are cleared under JioSaavn-only so a row labelled
        // "YouTube Music" can never contradict the setting.
        //
        // They are search-backed, not feed-backed, and that was measured rather
        // than assumed. Probed live against WEB_REMIX with this app's own client
        // identity: `FEmusic_charts` returns video charts, language tiles and a
        // "Top artists" carousel whose 40 rows are artists with no `videoId`, so
        // nothing on that page is playable; its chart playlists do yield 20 real
        // tracks ("Trending 20 India" resolves `playabilityStatus: OK`) but the
        // titles are upload packaging — "Full Video: Yaalalo Yaalalo | Irumudi |
        // Ravi Teja | …" — which is fine in a search list and unacceptable as a
        // Home card; `FEmusic_new_releases` returns albums this app has no flow
        // to open; and `FEmusic_moods_and_genres` answers 200 with no content.
        //
        // What does work is the Songs-tab search filter (`FILTER_SONGS`), which
        // turns a mixed result set into 30 clean `Artist • Album • Duration`
        // rows that all carry a `videoId`. `search()` gained `songsOnly`, and the
        // body moved into an `internal searchBody()` so the filter is unit-tested
        // — dropping `params` does not error, it silently changes the shape of
        // the results.
        //
        // 1.11 (build 12) — 2026-09-22. Home's rows now refresh when the user
        // returns to the app. They were fetched exactly once, when the ViewModel
        // was created, and the ViewModel is Activity-scoped — so an app left open
        // in the background for days kept showing the rows from its last cold
        // start, and with no pull-to-refresh the user had no way to ask for newer
        // ones. Nothing was cached (TrendingCache is dead code), so there was no
        // stale file to fix; the missing piece was the trigger, and it is now
        // `MainActivity.onResume` → `MainViewModel.refreshHomeIfStale()`.
        //
        // The four Home loaders became `suspend` and are driven by one
        // `loadHomeRows()` batch, still concurrent. That was not cosmetic: without
        // a batch there is no way to answer "is the last fetch still running?",
        // and the resume that follows a cold start would have doubled every
        // request. The decision itself is a pure function (`HomeRefreshPolicy`,
        // tested) because both failure modes are silent — too eager re-fetches
        // eight rows on every app switch, too shy leaves Home a day stale.
        //
        // 1.17.6 (build 24) — 2026-09-27. "make the app whole bug free if any
        // bug is there even a slightest bug…fix it" — a full sweep, so this
        // entry is what the sweep actually *found* rather than a feature list.
        // Android Lint was run over the module for the first time and is now
        // error-free; it had been failing with 36 errors, all of one kind.
        //
        // 1. Wrapped was rewriting its state to disk ~2.5 times a SECOND for
        //    as long as music played. `WrappedStatsManager.addListeningTime` is
        //    called from the 400 ms position ticker and persisted on every
        //    call — a full Gson encode of the month's id map plus a synchronous
        //    `commit()` of the entire `elara_settings` file, thousands of times
        //    an hour, for a counter the UI reads once. Its sibling
        //    `ListeningStatsManager` had already been fixed for exactly this and
        //    documented the trade; Wrapped simply never got the same treatment.
        //    It now batches on the same 5 s interval and flushes at every pause,
        //    at `MainActivity.onStop` and at playback release, so the batching
        //    window cannot outlive the app.
        //
        // 2. 36 `UnsafeOptInUsageError`s — media3's `@UnstableApi` call sites
        //    (ForwardingPlayer/Player overrides, MediaSession.Builder,
        //    MediaNotification.Provider, SpectrumTapper) taken without opting in.
        //    Not a runtime fault, but it is the mechanism that makes a media3
        //    upgrade tell you which of our classes are pinned to API that may
        //    move under them, and it was failing the build's own gate. Each site
        //    now opts in where the usage actually is: class-level on the two
        //    media3 wrappers and on the notification provider, on the one
        //    composable that consumes SpectrumTapper, method-level on the
        //    service's `onCreate`, and `@get:` on the audio session property —
        //    rather than blanketing whole files.
        //
        // 3. `MonthAggregate.KEEP_MONTHS` was declared, documented as the
        //    retention policy, and referenced by nothing: `rollover` already
        //    discards any month that is not the current one, so the constant
        //    described behaviour that lived somewhere else. The retention note
        //    now sits on `rollover`, where the rule actually is.
        //
        // Checked and deliberately left alone: the two `StaticFieldLeak`
        // warnings name singletons that store `applicationContext`, not an
        // Activity, so they are lint false positives; `ApplySharedPref` on
        // Wrapped's `commit()` is the documented durability choice (the write is
        // already on a background thread); and every `!!`, index, division and
        // `runBlocking` site the sweep re-read is guarded by the code above it.
        //
        // 1.17.5 (build 23) — 2026-09-27. "sometimes the song suddenly stops
        // or stops when i open another app" — one report, two causes, and both
        // live in the gap *between* tracks rather than during one.
        //
        // 1. Backgrounding. media3 only lets the playback service hold a
        //    foreground status — the thing that stops Android, and every
        //    aggressive OEM task cleaner, from reclaiming a backgrounded player
        //    — while the session player reports BUFFERING or READY. Verified in
        //    the 1.4.1 bytecode: MediaNotificationManager.shouldRunInForeground
        //    requires (playWhenReady) && state in {BUFFERING, READY}, and
        //    MediaSessionService.isPlaybackOngoing() is that same flag. ELARA is
        //    neither of those between tracks *by design*: the queue is a cursor
        //    and every stream URL is resolved lazily, so the player sits at
        //    ENDED, then IDLE, for the second or two the resolver takes. In that
        //    window the service is an ordinary background service — and that
        //    window opens on every track change, i.e. exactly when the user has
        //    just switched apps. QueueAwarePlayer, the session-facing view,
        //    now reports a track gap as BUFFERING while playWhenReady is true, so
        //    the foreground status survives the transition. A deliberate pause
        //    still reports the real state, so a paused app gives its foreground
        //    status up exactly as media3 intends.
        //
        // 2. Silence. A track that would not start (no resolved source, or a
        //    resolver that threw) set the error message and returned, and a
        //    mid-track stream failure went the same way — so ONE unresolvable
        //    song ended the whole listening session and left dead air, which is
        //    the other half of "the song suddenly stops". Both now move on to
        //    the next track, bounded by FailedTrackPolicy (three in a row, and
        //    never on a single-track queue), with the budget cleared by any
        //    track that really reaches READY and by any deliberate transport
        //    action, so a bad run can never stop the next good song.
        //
        // The diagnostics log now also records *why* playback paused, from
        // ExoPlayer's playWhenReady change reason, which separates "another app
        // took the audio over" (correct, by design, and indistinguishable from a
        // bug on a phone) from an actual failure. This is the first report static
        // analysis could not settle on its own; that line is what settles it.
        //
        // 1.17.4 (build 22) — 2026-09-25. Album tiles on Home opened to
        // "Couldn't load this playlist" again: JioSaavn renamed the album
        // response's song key `songs` → `list` AND flattened → nested in the
        // same move (the same rename the playlist endpoint pulled with
        // `fullsongs`). Verified live: the new shape is byte-compatible with
        // the playlist entry shape, so album entries now flow through the
        // playlist mapper, with the legacy flat shape kept as fallback. The
        // both-shapes contract is pinned by tests against fixtures captured
        // from the live API. This is the second silent-shape rename from this
        // host — the model now tolerates both keys the way the playlist
        // response already did.
        //
        // 1.17.3 (build 21) — 2026-09-25. Library layout by request: the
        // lifetime "10 hours 14 minutes listened" snapshot card is gone;
        // Wrapped is the only stats card above Playlists. The stats screen
        // itself still exists via its route, and Wrapped remains the monthly
        // slice of the same data.
        //
        // 1.17.2 (build 20) — 2026-09-25. Second critical fix in the same
        // tap: build 19 forwarded the PCM but never **flipped** the output
        // buffer. replaceOutputBuffer hands out a write-mode buffer (position
        // at data end, limit at capacity); the sink drains position→limit, so
        // an unflipped buffer reads back as ZERO bytes — playback sat in
        // "buffering" forever. Media3's own TeeAudioProcessor flips after its
        // put(); this now does too. The byte-forwarding tests were rewritten
        // to be count-first (they had compared drained-remnant-to-drained-
        // remnant and could pass on 0==0 bytes) and were red/green-verified:
        // with flip() removed, 5 of 6 fail.
        //
        // 1.17.1 (build 19) — 2026-09-25. Critical fix: build 18 played
        // silence on every track. The SpectrumTapper visualizer tap sat in the
        // player's audio-sink processor chain and only *observed* the PCM —
        // but a BaseAudioProcessor owns the speaker's data path, and whatever
        // it fails to forward never reaches the sink. queueInput now forwards
        // the buffer byte-exactly in every path and analyses a read-only
        // duplicate alongside it; analysis also disables itself when the sink
        // negotiates a non-16-bit encoding, where the band math would read
        // noise. (No visualiser code runs until the full-screen player opens,
        // which is why the silence shipped unnoticed by compile-time checks.)
        //
        // 1.17 (build 18) — 2026-09-25. Three features land together:
        //
        //  1. Live visualizer — a SpectrumTapper rides the player's audio sink
        //     (pass-through AudioProcessor) and the full-screen player draws
        //     24 log-spaced bars with attack/decay smoothing; costs nothing
        //     while the player is collapsed. The DSP (SpectrumAnalyzer) is
        //     pure and unit-tested.
        //  2. Speed modes — Normal / Slowed (rate 0.85 + reverb) / Nightcore
        //     (1.25) as a segmented control in Player Settings, persisted and
        //     re-applied per track start; reverb attaches per audio session
        //     and every step is guarded like the 1.16 hardening demands.
        //  3. Elara Wrapped — monthly plays / minutes / top songs, recorded
        //     from the same playback events history and stats already use,
        //     with a shareable text recap; entry point in Library above the
        //     lifetime stats row. The aggregate's Gson shape is registered in
        //     proguard-rules.pro and verify-release-dex.gradle.
        //
        // 1.16 (build 17) — 2026-09-25. "The app suddenly stops" hardening: a
        // static audit of every coroutine and callback found exactly one real
        // crash path — PlaybackManager.playAt's resolve chain ran unguarded in
        // a main-dispatcher coroutine, so a throwing resolver (or a released
        // player in setMediaItem/prepare) killed the process mid-tap. It now
        // degrades into the friendly playback-error banner plus a
        // RESOLVE_FAIL line in the diagnostics log. Two belt-and-braces guards
        // join it: a CoroutineExceptionHandler on the playback scope (any
        // future leak degrades to a CRASH_GUARD diagnostics line, not a
        // vanish) and an outer runCatching around refreshTrending, whose
        // cache-paint + flow-write glue was unguarded between its guarded
        // fetches. Every other launch site, persist path, downloader and
        // collector was verified already guarded — no behaviour changed there.
        //
        // 1.15 (build 16) — 2026-09-24. Home speaks the one visual language a
        // music app is expected to speak. Section headings grow a small
        // equalizer while sound is on (draw-phase only, frozen when the user
        // disables system animations); the playing card gets an accent border
        // and a scrim + mini equalizer over its artwork, both fading on
        // Motion.Quick; every tile now scales down slightly while pressed and
        // long-press ticks haptically before opening the menu. No layout
        // metrics changed — cards, shelves and spacing are exactly as before.
        //
        // 1.14 (build 15) — 2026-09-24. Home gained pull-to-refresh — the
        // gesture the 1.11 entry said the app was missing. It rides the
        // toolchain upgrade: M3 1.4.0's PullToRefreshBox, wired to the trending
        // fetch's `isConnecting` so a resume-driven refresh also shows the
        // spinner. The pull calls `retryHome`, not `refreshHomeIfStale` — a
        // pull is an explicit request and must not be declined for freshness.
        //
        // 1.13 (build 14) — 2026-09-24. Home now survives a failed load.
        // Two silent failure modes fixed:
        //
        //  1. A failed trending fetch wrote emptyList() into the row, so the
        //     user's Home lost Trending entirely until the next success —
        //     indistinguishable from a broken app. TrendingCache (dead code
        //     since it was written) is now wired in: every successful fetch is
        //     saved, a failed one serves the cached tracks (however old), and a
        //     cold start paints the cache before the fetch so the row is never
        //     empty while the network works. The decision is pure
        //     (TrendingCachePolicy, tested) for the same reason HomeRefreshPolicy
        //     is: every way of getting it wrong is invisible.
        //  2. All four Home loaders swallowed their errors into empty lists, so
        //     a user on flaky connectivity saw an empty screen with no
        //     explanation. A batch that finishes with both critical rows empty
        //     now shows a banner with a Retry button (retryHome), which also
        //     re-fetches trending and the YouTube rows.
        //
        // 1.12 (build 13) — 2026-09-22. Three real defects in the YouTube rows,
        // found by rendering both queries through the app's own parser and
        // looking at the output rather than at the counts:
        //
        //  1. The row labelled "new songs" contained 2018–2022 releases ("Dilbar
        //     (From Satyameva Jayate)", "O Saki Saki (From Batla House)", "Tum Hi
        //     Aana (From Marjaavaan)"). YouTube's song search ranks by popularity,
        //     not date, and this client has no new-songs feed — so the label
        //     lied. The query is now `Hip-Hop`, taken from the app's own
        //     `HomeCategories`, which keeps the row both honest and distinct
        //     (20 rows, zero overlap with the first row).
        //  2. The two rows shared 5 songs of 25. The second row now drops
        //     anything the first already shows.
        //  3. Entries were not always songs: "Bollywood Dj Non Stop Remix" at
        //     50:23 and "Party Mashup - DJ Praveen" at 30:17 were rendered as
        //     cards, and tapping one starts a 50-minute DJ set. A 15-minute cap
        //     removes them. Unknown durations are *kept* on purpose, so a change
        //     in YouTube's response shape degrades to "no duration known" rather
        //     than silently emptying the row.
        //
        // `YouTubeMusicRows.trending`/`.newSongs` became `.top`/`.genre`, and the
        // ViewModel's `youTubeTrending`/`youTubeNewSongs` became
        // `youTubeTop`/`youTubeHipHop` — a field named `newSongs` holding hip-hop
        // is how the wrong branch gets taken later.
        versionCode = 24
        versionName = "1.17.6"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {            useSupportLibrary = true
        }
    }

    signingConfigs {
        debug {
            storeFile = file("../debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        release {
            // Signed with the debug keystore so `assembleRelease` produces an
            // APK that can actually be installed. Without a signingConfig the
            // release output is unsigned, which is why the app had only ever
            // been judged from an unoptimised debug build.
            signingConfig = signingConfigs.debug

            // `debuggable = false` is the single biggest smoothness win
            // available and has nothing to do with the code. A debug build is
            // `android:debuggable="true"`, which makes ART skip ahead-of-time
            // compilation and JIT the whole app at runtime, and it keeps every
            // bit of Compose's debug instrumentation on. R8 on top of that
            // inlines the generated Compose code.
            debuggable = false
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // APK output name. The release build is the one to install, so it keeps the
    // plain `Elara.apk`; the debug build is suffixed so the two are never
    // confused once both exist on disk.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = variant.buildType.name == "release" ? "Elara.apk" : "Elara-debug.apk"
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation platform('androidx.compose:compose-bom:2026.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    
    // Media3
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media:media:1.7.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.5'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Icons
    implementation "androidx.compose.material:material-icons-extended:1.7.8"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

// Release-build gate. `assembleRelease` is finalised by `verifyReleaseDex`,
// which asserts that the reflection-critical classes, fields and enum
// constants actually survived R8 into classes.dex. With no emulator available,
// this is the only automated defence against Gson silently losing persisted
// data. Skip with `-PskipDexVerify` when you just want an APK.
apply from: 'verify-release-dex.gradle'
