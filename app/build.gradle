plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace = 'com.aesthetic.spotify'
    compileSdk = 34

    defaultConfig {
        applicationId = "com.aesthetic.spotify"
        minSdk = 26
        targetSdk = 34
        versionCode = 1
        versionName = "1.0"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {            useSupportLibrary = true
        }
    }

    signingConfigs {
        debug {
            storeFile = file("../debug.keystore")
            storePassword = "android"
            keyAlias = "androiddebugkey"
            keyPassword = "android"
        }
    }

    buildTypes {
        release {
            // Signed with the debug keystore so `assembleRelease` produces an
            // APK that can actually be installed. Without a signingConfig the
            // release output is unsigned, which is why the app had only ever
            // been judged from an unoptimised debug build.
            signingConfig = signingConfigs.debug

            // `debuggable = false` is the single biggest smoothness win
            // available and has nothing to do with the code. A debug build is
            // `android:debuggable="true"`, which makes ART skip ahead-of-time
            // compilation and JIT the whole app at runtime, and it keeps every
            // bit of Compose's debug instrumentation on. R8 on top of that
            // inlines the generated Compose code.
            debuggable = false
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            signingConfig = signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    // APK output name. The release build is the one to install, so it keeps the
    // plain `Elara.apk`; the debug build is suffixed so the two are never
    // confused once both exist on disk.
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = variant.buildType.name == "release" ? "Elara.apk" : "Elara-debug.apk"
        }
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.8'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
    implementation 'androidx.activity:activity-compose:1.8.1'
    implementation platform('androidx.compose:compose-bom:2023.10.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    
    // Media3
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media:media:1.7.0'

    // Navigation
    implementation 'androidx.navigation:navigation-compose:2.7.5'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Image loading
    implementation 'io.coil-kt:coil-compose:2.5.0'

    // Icons
    implementation "androidx.compose.material:material-icons-extended:1.5.4"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}

// Release-build gate. `assembleRelease` is finalised by `verifyReleaseDex`,
// which asserts that the reflection-critical classes, fields and enum
// constants actually survived R8 into classes.dex. With no emulator available,
// this is the only automated defence against Gson silently losing persisted
// data. Skip with `-PskipDexVerify` when you just want an APK.
apply from: 'verify-release-dex.gradle'
